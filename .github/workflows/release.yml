name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check the commits against the version and the changelog
        id: gate
        run: python tools/release_gate.py --before "${{ github.event.before }}" --after "${{ github.sha }}" --notes release_notes.md

      - name: Check the source rules
        run: python tools/check_source.py

      - name: Install the dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3 pyflakes==4.0.3

      - name: Lint
        run: python -m pyflakes bastard.pyw tools

      - name: Unit tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Build Bastard.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Bastard bastard.pyw

      - name: Fetch Process Monitor for the self-test
        continue-on-error: true
        run: |
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri https://download.sysinternals.com/files/ProcessMonitor.zip -OutFile procmon.zip
          Expand-Archive -Path procmon.zip -DestinationPath procmon -Force
          Copy-Item procmon/Procmon64.exe dist/

      - name: Self-test Bastard.exe
        run: python tools/run_selftest.py dist/Bastard.exe

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: Bastard
          path: dist/Bastard.exe

      - name: Publish the release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.gate.outputs.version }}" dist/Bastard.exe --title "Bastard ${{ steps.gate.outputs.version }}" --notes-file release_notes.md --target "${{ github.sha }}"
